[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stockdesk"
version = "0.1.0"
description = "Multi-agent stock research desk: one ticker in, one evidence-backed BUY, HOLD or SELL decision out."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Avishek Bhattacharjee" }]
dependencies = [
  "langgraph>=0.2",
  "yfinance>=0.2.40",
  "pandas>=2.0",
  "numpy>=1.24",
  "feedparser>=6.0",
  "httpx>=0.25",
  "pydantic>=2.5",
  "pydantic-settings>=2.1",
  "typer>=0.12",
  "rich>=13",
  "jinja2>=3.1",
  "matplotlib>=3.7",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
stockdesk = "stockdesk.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
stockdesk = ["report/templates/*.j2", "markets/data/*.csv", "web/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
